['check','var(--accent)','To-dos',td.length?(open?`${open} open, ${td.length-open} done.`:'Everything checked off. Nice.'):'Nothing carried over.'],
['box','var(--orange)','Orders',or.length?(na?`${na} need${na===1?'s':''} action. `:'')+(tr?`${tr} in transit.`:'')||'All delivered.':'No orders in flight.'],
['moon','var(--purple)','Sleep',sl.score!=null||sl.hours!=null?`${sl.hours!=null?esc(sl.hours)+' h':''}${sl.score!=null?' · score '+esc(sl.score):''}${D.checkin?' · felt '+esc(D.checkin.sleep_quality)+'/5':''}`:'No sleep data yet.']]
.map(h=>`<div class="hl cell"><div class="grow"><div class="k" style="color:${h[1]}">${svg(h[0])}${h[2]}</div><div>${h[3]}</div></div></div>`).join('')}
function vToday(v){const em=arr(D.emails),se=arr(D.sessions),td=arr(D.todos),or=arr(D.orders);
const tiles=[['s-em','mail','var(--blue)','Emails',em.length],['s-se','cal','var(--red)','Sessions',se.length],['s-td','check','var(--accent)','To-dos',td.length-[...getDone()].filter(i=>i<td.length).length],['s-or','box','var(--orange)','Orders',or.length]];
v.innerHTML=`<div class="tiles">${tiles.map(t=>`<div class="tile press" data-go="${t[0]}" role="button"><div class="top"><div class="ic" style="background:${t[2]}">${svg(t[1])}</div><b>${t[4]}</b></div><span>${t[3]}</span></div>`).join('')}</div>
${D.checkin?'':`<div class="group press" style="margin-top:10px" id="cibar"><div class="cell"><div class="ic sq" style="background:var(--accent)">${svg('heart')}</div><div class="grow"><div class="ttl">Morning check-in</div><div class="sub sm">Takes 20 seconds</div></div><span class="chev2">›</span></div></div>`}
<div class="sh big">Highlights</div><div class="group">${highlights()}</div>
<div class="sh" id="s-td"><span>To-dos</span></div><div id="todos"></div>
<div class="sh" id="s-se"><span>Sessions</span><span>${se.length||''}</span></div><div class="group">${agenda(se)}</div>
<div class="sh" id="s-em"><span>Important emails</span><span>${em.length||''}</span></div><div class="group">${em.length?em.map(e=>`<div class="cell ind"><div class="ic" style="background:var(--blue)">${svg('mail')}</div><div class="grow"><div class="ttl">${esc(e.sender)}</div><div>${safeUrl(e.link)?`<a href="${safeUrl(e.link)}" target="_blank" rel="noopener">${esc(e.subject)}</a>`:esc(e.subject)}</div>${e.why?`<div class="sub sm">${esc(e.why)}</div>`:''}</div></div>`).join(''):empty('mail','Inbox is calm. Nothing urgent.')}</div>
<div class="sh" id="s-or"><span>Orders</span><span>${or.length||''}</span></div><div class="group press" id="toor"><div class="cell"><div class="grow">${or.length?`${or.length} order${or.length>1?'s':''} — see Orders tab`:'No orders in flight'}</div><span class="chev2">›</span></div></div>`;
v.querySelectorAll('[data-go]').forEach(t=>t.onclick=()=>{const el=$('#'+t.dataset.go);if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-60,behavior:'smooth'})});
$('#toor').onclick=()=>{TAB='orders';localStorage.setItem('brief-tab',TAB);shell();scrollTo(0,0)};
if($('#cibar'))$('#cibar').onclick=()=>checkin(DATE);
renderTodos()}
function agenda(se){if(!se.length)return empty('cal','No sessions booked today. Enjoy the space.');const s=se.slice().sort((a,b)=>toMin(a.time)-toMin(b.time)),n=nowMin();const ni=s.findIndex(x=>toMin(x.time)>=n);
return s.map((x,i)=>`<div class="ag ${i===ni?'next':(ni===-1||i<ni)&&toMin(x.time)<9999?'past':''}"><div class="tm">${esc(x.time)}</div><div class="bar"></div><div class="grow">${i===ni?'<div class="nu">Next up</div>':''}<div class="ttl">${esc(x.name)}</div>${x.type||x.note?`<div class="sub sm">${esc(x.type||x.note)}</div>`:''}</div></div>`).join('')}
function renderTodos(){const h=$('#todos');if(!h)return;const td=arr(D.todos),dn=getDone();if(!td.length){h.innerHTML=`<div class="group">${empty('check','All clear. Nothing carried over.')}</div>`;return}
const row=(t,i,d)=>`<div class="swbg"><div class="cell todo ${d?'done':''}" data-i="${i}"><button class="cb ${d?'on':''}" aria-label="${d?'Mark not done':'Complete'}"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></button><div class="grow">${esc(todoText(t))}${t&&t.from?`<div class="sub sm">from ${esc(t.from)}</div>`:''}</div></div></div>`;
const open=td.map((t,i)=>[t,i]).filter(x=>!dn.has(x[1])),done=td.map((t,i)=>[t,i]).filter(x=>dn.has(x[1]));
h.innerHTML=`<div class="group">${open.length?open.map(x=>row(x[0],x[1],0)).join(''):empty('ok','Everything checked off. Nice work.')}
${done.length?`<details class="dn" ${localStorage.getItem('brief-dn-open')?'open':''}><summary><span>Done (${done.length})</span><span class="chev">›</span></summary>${done.map(x=>row(x[0],x[1],1)).join('')}</details>`:''}</div>`;
const dt=h.querySelector('details');if(dt)dt.ontoggle=()=>dt.open?localStorage.setItem('brief-dn-open',1):localStorage.removeItem('brief-dn-open');
h.querySelectorAll('.todo').forEach(r=>{const i=+r.dataset.i,cb=r.querySelector('.cb');
const toggle=()=>{const s=getDone();const was=s.has(i);was?s.delete(i):s.add(i);setDone(s);cb.classList.toggle('on',!was);if(navigator.vibrate)navigator.vibrate(10);setTimeout(()=>{r.classList.add('leaving');setTimeout(()=>{renderTodos();refreshTiles()},300)},250)};
cb.onclick=e=>{e.stopPropagation();toggle()};
let x0=null,dx=0;r.addEventListener('pointerdown',e=>{if(e.target.closest('.cb'))return;x0=e.clientX;dx=0});
r.addEventListener('pointermove',e=>{if(x0==null)return;dx=Math.max(0,e.clientX-x0);if(dx>8){r.style.transition='none';r.style.transform=`translateX(${dx}px)`}});
const end=()=>{if(x0==null)return;x0=null;r.style.transition='';r.style.transform='';if(dx>90&&!r.classList.contains('done'))toggle()};r.addEventListener('pointerup',end);r.addEventListener('pointercancel',end);r.addEventListener('pointerleave',end)})}
function refreshTiles(){const t=document.querySelector('[data-go="s-td"] b');if(t){const td=arr(D.todos);t.textContent=td.length-[...getDone()].filter(i=>i<td.length).length}}
function vOrders(v){const or=arr(D.orders);if(!or.length){v.innerHTML=`<div class="group">${empty('box','No orders in flight. New ones show up here.')}</div>`;return}
v.innerHTML=['a','t','d'].map(k=>{const g=or.filter(o=>oStat(o.status)===k);if(!g.length)return'';return `<div class="sh"><span>${OG[k][0]}</span><span>${g.length}</span></div><div class="group">${g.map(o=>`<div class="cell ind"><div class="ic sq" style="background:${k==='a'?'var(--red)':k==='t'?'var(--blue)':'#30d158'}">${svg('box')}</div><div class="grow"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div class="ttl">${esc(o.store)}</div><span class="pill ${OG[k][1]}">${esc(o.status||OG[k][0])}</span></div><div class="sub">${esc(o.item)}</div><div class="sub sm">${o.eta?'ETA '+esc(o.eta):''}${safeUrl(o.tracking)?`${o.eta?' · ':''}<a href="${safeUrl(o.tracking)}" target="_blank" rel="noopener">Track</a>`:''}</div></div></div>`).join('')}</div>`}).join('')}
function vSleep(v){const sl=D.sleep||{},ci=D.checkin;const has=sl.score!=null||sl.hours!=null;
if(!has){v.innerHTML=`<div class="group">${empty('moon','No sleep data yet.<br>Open the Oura app to sync.')}</div>${ciCard(ci)}`;bindCi();return}
const sc=Math.max(0,Math.min(100,+sl.score||0)),r=70,c=2*Math.PI*r;const col=sc>=85?'#30d158':sc>=70?'#2fbf71':sc>=60?'#ff9f0a':'#ff453a';
v.innerHTML=`<div class="group"><div class="ringwrap"><svg class="ring" viewBox="0 0 180 180"><circle cx="90" cy="90" r="${r}" fill="none" stroke="rgba(47,191,113,.18)" stroke-width="18"/><circle cx="90" cy="90" r="${r}" fill="none" stroke="${col}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 90 90)" id="arc" style="transition:stroke-dashoffset 1s ease"/><text x="90" y="92" text-anchor="middle" font-size="44" font-weight="700">${sl.score!=null?esc(sl.score):'—'}</text><text x="90" y="118" text-anchor="middle" font-size="13" fill="rgba(235,235,245,.6)">SLEEP SCORE</text></svg>${sl.source?`<div class="sub sm">from ${esc(sl.source)}</div>`:''}</div></div>
<div class="sh"><span>Details</span></div><div class="group"><div class="cell"><div class="grow">Time asleep</div><div class="sub">${sl.hours!=null?esc(sl.hours)+' h':'—'}</div></div><div class="cell"><div class="grow">Score</div><div class="sub">${sl.score!=null?esc(sl.score):'—'}</div></div><div class="cell"><div class="grow">How you felt</div><div class="sub">${ci?esc(ci.sleep_quality)+' / 5':'—'}</div></div>${sl.notes?`<div class="cell"><div class="grow sub">${esc(sl.notes)}</div></div>`:''}</div>${ciCard(ci)}`;
requestAnimationFrame(()=>setTimeout(()=>{const a=$('#arc');if(a)a.style.strokeDashoffset=c*(1-sc/100)},50));bindCi()}
function ciCard(ci){return `<div class="sh"><span>Morning check-in</span></div><div class="group">${ci?`<div class="cell"><div class="grow">Sleep quality</div><div class="sub">${esc(ci.sleep_quality)} / 5</div></div><div class="cell"><div class="grow">Energy</div><div class="sub">${esc(ci.energy)} / 5</div></div><div class="cell"><div class="grow">Mood</div><div class="sub">${esc(ci.mood||'—')}</div></div><div class="cell"><div class="grow">Soreness</div><div class="sub">${esc(ci.soreness||'—')}</div></div>${ci.note?`<div class="cell"><div class="grow sub">${esc(ci.note)}</div></div>`:''}`:`<div class="cell press" id="ciopen"><div class="ic sq" style="background:var(--accent)">${svg('heart')}</div><div class="grow ttl">Do check-in</div><span class="chev2">›</span></div>`}</div>`}
function bindCi(){const b=$('#ciopen');if(b)b.onclick=()=>checkin(DATE)}
function vMore(v){v.innerHTML=`<div class="group">${ciCard(D.checkin).replace(/^.*?<div class="group">/s,'').replace(/<\/div>$/,'')}</div>
<div class="sh"><span>Account</span></div><div class="group"><div class="cell ind press" id="cp"><div class="ic sq" style="background:#8e8e93">${svg('key')}</div><div class="grow">Change password</div><span class="chev2">›</span></div>
<div class="cell ind press" id="lo"><div class="ic sq" style="background:var(--red)">${svg('out')}</div><div class="grow red">Sign out</div></div></div>
<p class="sub sm" style="text-align:center;margin-top:24px">The Brief · for Krishna</p>`;
bindCi();$('#cp').onclick=()=>renderNewPassword(false);$('#lo').onclick=logout}
function checkin(date){if($('.modal'))return;const v={sleep_quality:0,energy:0};const m=document.createElement('div');m.className='modal';
const sc=k=>`<div class="scale" data-k="${k}">${[1,2,3,4,5].map(n=>`<button type="button" class="press" data-n="${n}">${n}</button>`).join('')}</div>`;
m.innerHTML=`<form class="sheet" id="cf"><div class="grab"></div><h2>Morning check-in</h2><p class="sub" style="margin:2px 0 6px">Takes 20 seconds.</p>
<div class="lbl">Sleep quality (1–5)</div><div class="group">${sc('sleep_quality')}</div><div class="lbl">Energy (1–5)</div><div class="group">${sc('energy')}</div>
<div class="lbl">Details</div><div class="group form"><div class="cell"><select id="mood" aria-label="Mood"><option value="">Mood</option><option>Great</option><option>Good</option><option>Okay</option><option>Low</option><option>Stressed</option></select></div>
<div class="cell"><input id="sore" placeholder="Soreness, e.g. legs a bit tight" aria-label="Soreness"></div>
<div class="cell"><textarea id="note" rows="2" placeholder="One note" aria-label="Note"></textarea></div></div>
<div class="err" id="cer"></div><div style="display:flex;gap:8px"><button type="button" class="btn sec press" id="later" style="flex:1">Later</button><button class="btn press" style="flex:2">Save</button></div></form>`;
document.body.appendChild(m);requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('in')));
const close=()=>{m.classList.remove('in');setTimeout(()=>m.remove(),300)};
m.onclick=e=>{if(e.target===m)close()};
const sh=m.querySelector('.sheet'),gb=m.querySelector('.grab');let y0=null,dy=0;
sh.addEventListener('touchstart',e=>{if(sh.scrollTop>0)return;y0=e.touches[0].clientY;dy=0},{passive:true});
sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`},{passive:true});
sh.addEventListener('touchend',()=>{if(y0==null)return;y0=null;sh.style.transition='';sh.style.transform='';if(dy>120)close()});
m.querySelectorAll('.scale').forEach(s=>s.onclick=e=>{const n=e.target.dataset.n;if(!n)return;v[s.dataset.k]=+n;if(navigator.vibrate)navigator.vibrate(8);s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.n===n))});
m.querySelector('#later').onclick=close;
m.querySelector('#cf').onsubmit=async e=>{e.preventDefault();if(!v.sleep_quality||!v.energy){m.querySelector('#cer').textContent='Pick sleep quality and energy.';return}
try{await api('/rest/v1/rpc/brief_save_checkin',{method:'POST',body:JSON.stringify({p_date:date,p_data:{...v,mood:m.querySelector('#mood').value,soreness:m.querySelector('#sore').value.trim(),note:m.querySelector('#note').value.trim()}})});close();await fetchDay();shell()}catch(x){m.querySelector('#cer').textContent=x.message}}}
async function fetchDay(){DATE=today();const rows=await api('/rest/v1/brief_days?date=eq.'+DATE+'&select=*');D=rows[0]||{}}
async function load(){if(!sess)return renderLogin();app.innerHTML='<p class="sub" style="margin-top:40vh;text-align:center">Loading…</p>';
try{const own=await api('/rest/v1/brief_owners?select=user_id');if(!own.length){logout();return renderLogin('This account is not allowed.')}
await fetchDay();shell();if(!D.checkin&&localStorage.getItem('brief-ci-shown')!==DATE){localStorage.setItem('brief-ci-shown',DATE);setTimeout(()=>checkin(DATE),400)}}
catch(x){if(sess)app.innerHTML=`<div class="login"><div class="group">${empty('spark',esc(x.message))}</div><button class="btn press" style="margin-top:12px" onclick="load()">Retry</button></div>`}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(!recoveryFromHash()){const eh=new URLSearchParams(location.hash.slice(1));if(eh.get('error')){history.replaceState(null,'',location.pathname);sess=null;localStorage.removeItem('brief-sess');renderLogin('That reset link has expired or was already used. Request a new one.')}else load()}
</script></body></html>
