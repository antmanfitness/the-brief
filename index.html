<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030404"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="The Brief">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>The Brief</title>
<style>
:root{--accent:#2fbf71;--accent2:#5fd895;--tint:rgba(47,191,113,.16);--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--sep:rgba(84,84,88,.55);--text:#fff;--muted:rgba(235,235,245,.6);--muted2:rgba(235,235,245,.3);--red:#ff453a;--orange:#ff9f0a;--blue:#0a84ff;--purple:#bf5af2;--yellow:#ffd60a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;font:-apple-system-body}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",sans-serif;font-size:1.0625rem;line-height:1.35;overflow-x:hidden}
body{font-size:17px}
a{color:var(--accent2);text-decoration:none}
.wrap{max-width:600px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 96px)}
.navbar{position:fixed;top:0;left:0;right:0;z-index:5;padding:env(safe-area-inset-top) 16px 0;height:calc(env(safe-area-inset-top) + 44px);display:flex;align-items:center;justify-content:center;background:rgba(18,18,18,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.navbar .nt{font-weight:600;font-size:17px;opacity:0;transform:translateY(6px);transition:.2s}
.navbar.sm{border-color:var(--sep)}.navbar.sm .nt{opacity:1;transform:none}
.lt{padding-top:calc(env(safe-area-inset-top) + 52px)}
.lt h1{font-size:34px;font-weight:700;letter-spacing:.37px;margin:0;line-height:1.2;transform-origin:left bottom;transition:transform .1s}
.upd{color:var(--muted);font-size:13px;margin:2px 0 14px}
.ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;transition:height .2s}
.ptr .sp{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--muted2);border-top-color:var(--accent);margin-right:8px}
.ptr.go .sp{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sh{font-size:13px;text-transform:uppercase;color:var(--muted);margin:22px 16px 7px;letter-spacing:-.08px;display:flex;justify-content:space-between}
.sh.big{font-size:22px;font-weight:700;text-transform:none;color:var(--text);margin:24px 0 8px;letter-spacing:.35px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;overflow-wrap:anywhere}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.cell.ind+.cell.ind::before{left:60px}
.cell .grow{flex:1}.sub{color:var(--muted);font-size:15px}.sub.sm{font-size:13px}
.ttl{font-weight:600}
.press{transition:transform .12s ease,opacity .12s;cursor:pointer;user-select:none;-webkit-user-select:none}.press:active{transform:scale(.97);opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start}
.tile b{font-size:28px;font-weight:700;line-height:1}
.tile span{color:var(--muted);font-weight:600;font-size:15px}
.ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sq{width:30px;height:30px;border-radius:8px}
.hl{padding:12px 16px}.hl .k{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.hl .k svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-block;max-width:100%;padding:3px 9px;margin:3px 0;border-radius:10px;font-size:12px;font-weight:600;white-space:normal;overflow-wrap:anywhere}
.p-g{background:rgba(48,209,88,.18);color:#30d158}.p-o{background:rgba(255,159,10,.18);color:var(--orange)}.p-r{background:rgba(255,69,58,.2);color:#ff6961}.p-b{background:rgba(10,132,255,.2);color:#64a8ff}
.cb{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted2);flex:none;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;cursor:pointer;padding:0;background:none}
.cb svg{width:14px;height:14px;fill:none;stroke:#000;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s .05s}
.cb.on{background:var(--accent);border-color:var(--accent);animation:pop .3s}.cb.on svg{stroke-dashoffset:0}
@keyframes pop{50%{transform:scale(1.2)}}
.todo{transition:opacity .35s,transform .35s;touch-action:pan-y;background:var(--card)}.todo.leaving{opacity:0;transform:translateX(20px)}
.todo.done .grow{color:var(--muted);text-decoration:line-through}
.swbg{position:relative;overflow:hidden}.swbg::after{content:"Done";position:absolute;inset:0;background:var(--accent);color:#000;font-weight:700;display:flex;align-items:center;padding-left:20px;z-index:0}
.swbg .todo{position:relative;z-index:1}
details.dn summary{list-style:none;cursor:pointer;color:var(--muted);font-size:15px;padding:12px 16px;display:flex;justify-content:space-between}details.dn summary::-webkit-details-marker{display:none}
details.dn[open] summary .chev{transform:rotate(90deg)}.chev{transition:transform .2s;display:inline-block}
.ag{display:flex;gap:12px;padding:12px 16px;position:relative}.ag+.ag::before{content:"";position:absolute;top:0;right:0;left:88px;border-top:.5px solid var(--sep)}
.ag .tm{width:60px;flex:none;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.ag .bar{width:4px;border-radius:2px;background:var(--card2);flex:none}
.ag.next{background:var(--tint)}.ag.next .tm{color:var(--accent2)}.ag.next .bar{background:var(--accent)}.ag.past{opacity:.5}
.nu{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--accent2);text-transform:uppercase}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 20px;color:var(--muted);gap:8px;font-size:15px}
.empty svg{width:34px;height:34px;fill:none;stroke:var(--muted2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ringwrap{display:flex;flex-direction:column;align-items:center;padding:20px 16px 16px}
.ring{width:180px;height:180px;max-width:60vw;max-height:60vw}
.ring text{fill:#fff;font-family:inherit}
.banner{background:rgba(255,159,10,.15);color:var(--orange);border-radius:12px;padding:10px 14px;font-weight:600;font-size:13px;text-align:center;margin-bottom:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(18,18,18,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;background:none;border:0;color:#8e8e93;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;padding:2px 0;font-family:inherit;cursor:pointer}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}.tabs button.on svg{stroke-width:2.2}
.btn,button.btn{appearance:none;border:0;border-radius:12px;background:var(--accent);color:#03140a;font-weight:600;padding:14px;font-size:17px;width:100%;font-family:inherit;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--text)}
.chev2{color:var(--muted2);font-size:20px}
.red{color:var(--red)}
input,textarea,select{width:100%;background:transparent;color:var(--text);border:0;padding:12px 16px;font-size:17px;font-family:inherit;outline:none}
.form .cell{padding:0}
.lbl{font-size:13px;color:var(--muted);margin:16px 16px 6px;text-transform:uppercase}
.login{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12vh) 16px 40px}
.login h1{font-size:34px;margin:0}.login h1 b{color:var(--accent)}
.err{color:#ff6961;font-size:15px;min-height:20px;margin:10px 16px}
.lnk{display:block;text-align:center;margin-top:14px;font-size:15px;color:var(--accent2);background:none;border:0;font-family:inherit;width:100%;cursor:pointer}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px}.scale button{padding:10px 0;background:var(--card2);border:0;border-radius:10px;color:var(--text);font-size:17px;font-family:inherit}
.scale button.on{background:var(--accent);color:#03140a;font-weight:700}
.modal{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);transition:background .3s}
.modal.in{background:rgba(0,0,0,.5)}
.sheet{background:#1c1c1e;border-radius:14px 14px 0 0;width:100%;max-width:600px;max-height:92vh;overflow:auto;padding:6px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.modal.in .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--muted2);margin:0 auto 10px}
.sheet h2{font-size:22px;margin:4px 0 0}
.sheet .group{background:var(--card2)}.sheet .scale button{background:#3a3a3c}
.hide{display:none!important}
.updt{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:20;border:0;border-radius:999px;padding:10px 18px;font:600 14px -apple-system,system-ui,sans-serif;color:#fff;background:rgba(34,36,38,.72);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(95,216,149,.45),0 8px 24px rgba(0,0,0,.5);max-width:calc(100% - 32px);white-space:nowrap;cursor:pointer}
@media (prefers-reduced-transparency: reduce){.updt{background:#1c1c1e;-webkit-backdrop-filter:none;backdrop-filter:none}}

/* ===== iOS 27 Liquid Glass layer ===== */
:root{--glass:rgba(34,36,38,.64);--glass-strong:rgba(28,30,31,.72);--blur:blur(28px) saturate(190%);
--spec:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),inset 0 0 0 .5px rgba(255,255,255,.14);
--edge:0 0 0 .5px rgba(0,0,0,.65),0 10px 30px rgba(0,0,0,.45);--r-card:22px;--pad:14px}
body{background:radial-gradient(120% 60% at 15% -10%,rgba(47,191,113,.22),transparent 60%),radial-gradient(90% 50% at 110% 30%,rgba(47,191,113,.10),transparent 60%),#000;background-attachment:fixed;min-height:100vh}
.glass,.group,.tile,.sheet,.tabs,.navbar{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--spec),var(--edge)}
.group,.tile{border-radius:var(--r-card)}
.tile{padding:var(--pad)}
/* concentric: inner radius = outer - padding */
.tile .ic{border-radius:calc(var(--r-card) - var(--pad))}
.ic.sq{border-radius:9px}
.cell.ind .ic{border-radius:50%}
.hl{padding:12px 18px}
.hl .k{font-size:12px;letter-spacing:.2px;text-transform:uppercase}
.sh{margin:22px 18px 8px}
.lt h1{font-size:34px;font-weight:800;letter-spacing:.2px}
/* scroll-edge effect instead of a hard bar */
.navbar{background:linear-gradient(to bottom,rgba(0,0,0,.75),rgba(0,0,0,.35) 70%,transparent);box-shadow:none;border:0!important;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);height:calc(env(safe-area-inset-top) + 56px)}
/* floating capsule tab bar */
.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(360px,calc(100% - 32px));border-radius:999px;border:0;padding:6px;gap:2px;transition:width .35s cubic-bezier(.2,.9,.3,1),padding .3s}
.tabs button{border-radius:999px;padding:6px 0 5px;transition:background .25s,color .2s,transform .12s}
.tabs button:active{transform:scale(.94)}
.tabs button.on{background:rgba(47,191,113,.18);box-shadow:inset 0 0 0 .5px rgba(95,216,149,.35)}
.tabs.min{width:64px}.tabs.min button:not(.on){display:none}.tabs.min button span{display:none}.tabs.min button{padding:9px 0}
.wrap{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
/* buttons: capsules */
.btn,button.btn{border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(47,191,113,.28)}
.btn.sec{background:rgba(120,120,128,.24);box-shadow:var(--spec)}
.scale button{border-radius:999px;background:rgba(120,120,128,.2)!important;box-shadow:var(--spec)}
.scale button.on{background:var(--accent)!important;color:#03140a}
.pill{border-radius:999px}
.cb{width:26px;height:26px}
/* timeline */
.ag .bar{width:3px}
.ag.next{background:linear-gradient(90deg,rgba(47,191,113,.22),rgba(47,191,113,.06));box-shadow:inset 0 0 0 .5px rgba(95,216,149,.3);border-radius:16px;margin:4px 6px}
.ag.next::before,.ag.next+.ag::before{display:none}
.ag .dotn{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(47,191,113,.25);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(47,191,113,.08)}}
/* ring glow */
.ring{filter:drop-shadow(0 0 18px rgba(47,191,113,.35))}
/* empty state glyph in glass bubble */
.empty .eg{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(120,120,128,.16);box-shadow:var(--spec)}
.empty .eg svg{stroke:var(--accent2);opacity:.8}
/* sheet */
.sheet{background:var(--glass-strong);border-radius:34px 34px 0 0;padding-left:18px;padding-right:18px}
.sheet .group{background:rgba(120,120,128,.14);box-shadow:var(--spec)}
.modal.in{background:rgba(0,0,0,.35)}
/* login */
.login .group{border-radius:24px}
.login .group .cell{padding:2px 4px}
.login h1{font-weight:800}
.banner{border-radius:999px}
/* toggle (iOS 27 style, used where needed) */
.tg{appearance:none;width:52px;height:32px;border-radius:999px;background:rgba(120,120,128,.32);position:relative;transition:background .25s;flex:none;cursor:pointer;padding:0;border:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1),width .2s}
.tg:active::after{width:34px}.tg.on{background:var(--accent)}.tg.on::after{transform:translateX(20px)}.tg.on:active::after{transform:translateX(14px)}
/* narrow: summary pane only on Today */
.paneL>.sh.big:first-child{margin-top:0}
.desc{color:rgba(255,255,255,.85);font-size:13px;line-height:1.35;margin:-4px 18px 9px;overflow-wrap:anywhere}
.sh.big+.desc{margin:-4px 2px 10px}
.obj{font-size:20px;font-weight:700;margin:6px 0 12px;letter-spacing:.2px}
.lt h1{overflow-wrap:anywhere}
.paneR>.sh:first-child,.paneR>.sh:first-of-type{margin-top:0}
/* Accessibility: Reduce Transparency */
@media (prefers-reduced-transparency: reduce){
 body{background:#000}
 .glass,.group,.tile,.sheet,.tabs,.navbar{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
 .group,.tile{background:#1c1c1e}.sheet{background:#1c1c1e}.tabs{background:#1c1c1e}.navbar{background:#000;-webkit-mask-image:none;mask-image:none}
 .sheet .group{background:#2c2c2e}
}
/* Accessibility: Increase Contrast */
@media (prefers-contrast: more){
 :root{--muted:rgba(235,235,245,.85);--muted2:rgba(235,235,245,.6);--sep:rgba(235,235,245,.45)}
 .group,.tile,.sheet,.tabs{box-shadow:0 0 0 1px rgba(255,255,255,.55)!important;background:#111}
 .tabs button{color:#d1d1d6}.tabs button.on{color:#5fd895;background:rgba(47,191,113,.3)}
 .btn{box-shadow:0 0 0 1px #fff!important}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ===== iPhone Duo open / wide: two panes ===== */
@media (min-width:700px),(horizontal-viewport-segments:2){
 .wrap{max-width:1180px;padding:0 24px 48px}
 .navbar{display:none}
 .lt{padding-top:calc(env(safe-area-inset-top) + 76px)}
 .tabs{top:calc(env(safe-area-inset-top) + 10px);bottom:auto;width:auto;min-width:380px;max-width:520px}
 .tabs button{flex-direction:row;gap:6px;padding:8px 16px;font-size:14px}.tabs svg{width:20px;height:20px}
 .tabs.min{width:auto}.tabs.min button:not(.on){display:flex}.tabs.min button span{display:inline}.tabs.min button{padding:8px 16px}
 #view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:40px;align-items:start}
 main:not(.tab-today) .paneL{display:block}
 .paneL{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto;scrollbar-width:none}
 .paneL,.paneR{max-width:560px;width:100%;justify-self:center}
 .paneR>.sh:first-child{margin-top:0}
 .modal{align-items:center}
 .sheet{max-width:560px;border-radius:34px;padding-bottom:22px;max-height:88vh}
 .login{max-width:440px;padding-top:14vh}
}
/* true dual-segment: align panes to segments so nothing straddles the hinge */
@media (horizontal-viewport-segments:2){
 .wrap{max-width:none;padding:0}
 #view{grid-template-columns:env(viewport-segment-width 0 0) env(viewport-segment-width 1 0);column-gap:calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0))}
 .paneL,.paneR{padding:0 20px;max-width:none}
 .lt{padding-left:20px;width:env(viewport-segment-width 0 0)}
 .tabs{left:env(viewport-segment-left 1 0);transform:translateX(16px)}
 .modal{justify-content:flex-start}.sheet{margin-left:calc(env(viewport-segment-left 1 0) + (env(viewport-segment-width 1 0) - min(560px,env(viewport-segment-width 1 0)))/2)}
}

/* ---- v10: badges, weather, Sophia, segmented, gym colors, peek ---- */
.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{align-items:center;justify-content:center;padding:14px 0;position:relative;overflow:visible}
.ic.big{width:52px;height:52px;border-radius:50%;position:relative}.ic.big svg{width:26px;height:26px}
.badge{position:absolute;top:-5px;right:-7px;min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:#FF3B30;color:#fff;font:700 12px/21px -apple-system,system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px rgba(0,0,0,.85);animation:badgeIn .5s var(--spring) both,badgePulse 2.6s ease-in-out .6s 2}
.ltrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ltrow h1{flex:1}
.sbtn{flex:none;margin-top:4px;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 14px;color:#fff;font:600 15px -apple-system,system-ui,sans-serif;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--spec),var(--edge);cursor:pointer}
.sbtn svg{width:18px;height:18px;fill:none;stroke:var(--accent2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wx{display:flex;align-items:center;gap:12px;margin:2px 0 14px;padding:10px 14px;border-radius:999px;min-height:48px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--spec),var(--edge);opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s var(--spring)}
.wx.ready{opacity:1;transform:none}.wx:empty{display:none}
.wxi svg{width:28px;height:28px;fill:none;stroke:#ffd60a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.wxt{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}.wxt b{font-size:22px}.wxt span{color:rgba(255,255,255,.85);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxr{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:rgba(255,255,255,.85);flex:none}
.wxr span{display:flex;align-items:center;gap:3px}.wxr svg{width:11px;height:11px;fill:none;stroke:#64d2ff;stroke-width:2.4}

/* ---- motion (Set Orbit feel) ---- */
:root{--spring:cubic-bezier(.32,.72,0,1);--pop:cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tabIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes iconBounce{0%{transform:scale(1)}35%{transform:scale(.82)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes badgeIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes ripple{from{opacity:.55;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
@keyframes reflow{from{opacity:.4;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.enter{animation:fadeUp .42s var(--spring) both;animation-delay:calc(var(--i,0) * 40ms)}
#view{animation:tabIn .22s var(--spring) both}
#view.reflow{animation:reflow .38s var(--spring) both}
#agw.swap{animation:swap .26s var(--spring) both}
.tabs button.on svg{animation:iconBounce .42s var(--pop)}
.tile .ic.big::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(95,216,149,.55),transparent 65%);opacity:0;pointer-events:none}
.tile:active .ic.big::after{animation:ripple .5s ease-out}
.tile:active{transform:scale(.94)}
.press{transition:transform .25s var(--pop),opacity .15s}.press:active{transform:scale(.96)}
/* orbit PTR spinner */
.ptr .sp{position:relative;border:1px solid rgba(95,216,149,.35)!important;border-top-color:rgba(95,216,149,.35)!important;background:none}
.ptr .sp::after{content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.ptr.go .sp{animation:spin .9s var(--spring) infinite}
/* sleep ring orbit sweep */
#arc{transition:stroke-dashoffset 1.2s var(--spring)!important}
.ring .planet{transform-origin:90px 90px;transform-box:view-box;transition:transform 1.2s var(--spring)}
/* sheet spring + dimming backdrop (opacity only) */
.modal{background:none!important}
.modal::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.modal.in::before{opacity:1}
.sheet{position:relative;transition:transform .5s var(--spring)!important}
@media (min-width:700px),(horizontal-viewport-segments:2){.sheet{transform:translateY(40px) scale(.96);opacity:0;transition:transform .45s var(--spring),opacity .25s!important}.modal.in .sheet{transform:none;opacity:1}}
@media (prefers-reduced-transparency: reduce){.wx,.sbtn{background:#1c1c1e;-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast: more){.wx,.sbtn,.seg{box-shadow:0 0 0 1px rgba(255,255,255,.55)!important}.badge{box-shadow:0 0 0 2px #000}}
@media (prefers-reduced-motion: reduce){.enter,#view,.badge,.tabs button.on svg{animation:none!important}.wx{transition:none}}

w.innerHTML=`${tickerH()}<div class="seg4">${[['day','Day'],['week','Week'],['month','Month']].map(x=>`<button class="${CR===x[0]?'on':''}" data-act="cr" data-k="${x[0]}">${x[1]}</button>`).join('')}</div>${CR!=='day'?monthH():''}<div class="sh"><span>Agenda</span></div><div id="agl" data-start="${st}">${Array.from({length:AGN},(_,i)=>agDay(addD(st,i))).join('')}</div>${CR==='month'?'<div id="agsent" style="height:1px"></div>':''}`;
if(AGIO)AGIO.disconnect();const sent=$('#agsent');if(sent){AGIO=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&AGN<365){const l=$('#agl');const st=l.dataset.start;l.insertAdjacentHTML('beforeend',Array.from({length:30},(_,i)=>agDay(addD(st,AGN+i))).join(''));AGN+=30}},{rootMargin:'400px'});AGIO.observe(sent)}}
function agendaScrollTo(ds){const l=$('#agl');if(!l)return false;const st=l.dataset.start;const n=dayDiff(st,ds);if(n<0)return false;while(AGN<=n&&AGN<400){l.insertAdjacentHTML('beforeend',Array.from({length:30},(_,i)=>agDay(addD(st,AGN+i))).join(''));AGN+=30}
const el=l.querySelector(`.agd[data-d="${ds}"]`);if(!el)return false;const mg=$('#mg');if(mg&&CR==='month'&&!MCOL&&!WIDE()){MCOL=true;mg.classList.add('col');setTimeout(()=>agendaScrollTo(ds),RMQ.matches?0:320);return true}const sc=WIDE()?$('#pl'):null;const off=WIDE()?0:(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0)+120;
if(sc&&sc.scrollHeight>sc.clientHeight){sc.scrollTo({top:el.offsetTop-sc.offsetTop-8,behavior:RMQ.matches?'auto':'smooth'})}else scrollTo({top:el.getBoundingClientRect().top+scrollY-(WIDE()?80:110),behavior:RMQ.matches?'auto':'smooth'});return true}

const hs=[...document.querySelectorAll('#agl .agd')];const top=WIDE()?($('#pl').getBoundingClientRect().top+30):120;let cur=null;for(const h of hs){if(h.getBoundingClientRect().top<=top)cur=h.dataset.d;else break}
if(cur&&cur!==lastAg){lastAg=cur;document.querySelectorAll('#tick .tkd').forEach(b=>b.classList.toggle('sel',b.dataset.k===cur));const b=document.querySelector(`#tick .tkd[data-k="${cur}"]`);const t=$('#tick');if(b&&t)t.scrollTo({left:b.offsetLeft-t.clientWidth/2+b.offsetWidth/2,behavior:'smooth'});window.__agHead=cur}}

<div class="lbl">Priority</div><div class="fl">${[1,2,3,4].map(p=>`<button type="button" class="fbtn ${(t.prio||4)===p?'on':''}" style="color:${PRIO[p][0]}" data-act="dprio" data-k="${p}">${flagSvg(PRIO[p][0])}${PRIO[p][1]}</button>`).join('')}</div>

<div class="lbl">Notes</div><div class="group form"><div class="cell"><textarea name="notes" rows="3" aria-label="Notes" placeholder="Notes">${esc(t.notes||'')}</textarea></div></div>
${t.kind==='event'?`<p style="margin:12px 4px"><a href="${esc(gcalUrl({...t,date:i.ds}))}" target="_blank" rel="noopener">Add to Google Calendar (preview link) ›</a></p>`:''}
<div style="display:flex;gap:8px;margin-top:14px"><button type="button" class="btn sec press" data-act="ddel" style="flex:1">Delete</button><button class="btn press" style="flex:2">Save</button></div></form>`}
if(kind==='order'){const o=arr(D.orders)[+arg];if(!o)return hd+empty('box','Order not found.');const k=oStat(o.status);return hd+`<div class="dhero" style="--gc:${k==='a'?'#ff453a':k==='t'?'#0a84ff':'#30d158'}"><div class="nu">${esc(o.source||o.store||'Order')}</div><div class="dtitle">${esc(o.item||o.store)}</div><span class="pill ${OG[k][1]}">${esc(o.status||OG[k][0])}</span></div>
<div class="group">${[['Store',o.store],['Source',o.source],['Status',o.status],['ETA',o.eta],['Buyer',o.buyer],['Price',o.price]].filter(x=>x[1]).map(x=>`<div class="kv"><span>${x[0]}</span><span>${esc(x[1])}</span></div>`).join('')}</div>${safeUrl(o.tracking)?`<a class="btn press" style="display:block;text-align:center;margin-top:14px" href="${safeUrl(o.tracking)}" target="_blank" rel="noopener">Track package</a>`:''}`}
if(kind==='day'){const it=itemsOn(arg);return hd+`<div class="dtitle">${esc(dayLabel(arg))}</div><div class="tl">${it.length?it.map(pillH).join(''):`<div class="group">${empty('cal','Nothing on this day.')}</div>`}</div>`}
if(kind==='widget')return hd+widgetH();return hd}
function bindDetail(root){fixBB(root);if(DET&&DET.kind==='widget')widgetList();const f=root.querySelector('#dform');if(!f)return;f.onsubmit=e=>{e.preventDefault();const i=findItem(DET.arg);if(!i)return;const fd=new FormData(f);const ch={title:fd.get('title').trim()||i.t.title,emoji:fd.get('emoji').trim(),labels:fd.get('labels').split(',').map(x=>x.trim().replace(/^#/,'').toLowerCase()).filter(Boolean),time:fd.get('time')||null,notes:fd.get('notes')};const nd=fd.get('date')||null;
if(i.t.repeat)recurChoice(i,ch,nd);else{Object.assign(i.t,ch,{date:nd});save();toast2('Saved');closeDetail();rerender()}}}

function recurChoice(i,ch,nd,del){const S2=sheet(`<h2>${del?'Delete':'Edit'} repeating ${i.t.kind==='event'?'event':'task'}</h2><p class="sub" style="margin:2px 0 14px">${esc(rtext(i.t.repeat))} · ${esc(dayLabel(i.ds))}</p><button type="button" class="btn press" id="r1">This one only</button><button type="button" class="btn sec press" id="r2" style="margin-top:10px">This and future</button><button type="button" class="lnk" id="r3">Cancel</button>`);if(!S2)return;const{m,close}=S2;
m.querySelector('#r3').onclick=close;m.querySelector('#r1').onclick=()=>{const t=i.t;t.ex=[...(t.ex||[]),i.ds];if(!del){const occSt=(t.occ||{})[i.ds]||'todo';S.tasks.push({...JSON.parse(JSON.stringify(t)),...ch,id:uid(),repeat:null,until:null,ex:[],occ:{},date:nd||i.ds,status:occSt,from:t.id})}save();close();closeDetail();rerender();toast2(del?'Deleted this one':'Saved this one')};

const ACT={
check(a){const i=findItem(a.dataset.k);if(!i)return;const was=i.done;toggleItem(i);const p=a.closest('.tp');if(!was){a.classList.add('on');chime();popAt(a,i.color);if(navigator.vibrate)navigator.vibrate(10)}else a.classList.remove('on');if(p)p.classList.toggle('done',!was);setTimeout(rerender,was?0:450)},

function notify(title,body,tag){const fired=JSON.parse(localStorage.getItem('brief-fired')||'{}');if(fired[tag])return;fired[tag]=Date.now();localStorage.setItem('brief-fired',JSON.stringify(fired));
if('Notification' in window&&Notification.permission==='granted'&&REG&&REG.showNotification){REG.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'}).catch(()=>toast2(title+' — '+body))}else toast2('⏰ '+title+(body?' — '+body:''))}
function checkReminders(){const n=nowMin();(S.habits||[]).forEach(h=>{if(h.remind&&!(h.log||{})[DATE]&&n>=hm2min(h.remind)&&n<hm2min(h.remind)+120)notify(h.name,'Habit reminder · keep the streak','h:'+h.id+':'+DATE)});
occOn(DATE).forEach(o=>{const a=o.t.alert;if(!a||o.done)return;let at=null;if(a.before!=null&&o.t.time)at=hm2min(o.t.time)-a.before;else if(a.time&&(!a.date||a.date===DATE))at=hm2min(a.time);if(at!=null&&n>=at&&n<at+120)notify(o.t.title,o.t.time?'At '+fmtMin(hm2min(o.t.time)):'Reminder','t:'+o.key)})}

function chipsFor(p){const c=[];const C=(t,cls,col)=>c.push(`<span class="chip on" style="--gc:${col}" data-chip="${cls}"><span>${esc(t)}</span></span>`);
if(p.forced)C(p.kind==='task'?'Task':'Event','kind','#2fbf71');if(p.date)C('📅 '+dayLabel(p.date).split(' · ')[0]+(dayDiff(DATE,p.date)>1||dayDiff(DATE,p.date)<0?'':' · '+dparse(p.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})),'date','#0a84ff');
if(p.time)C('🕒 '+fmtMin(hm2min(p.time)),'time','#0a84ff');if(p.repeat)C('↻ '+rtext(p.repeat),'repeat','#bf5af2');if(p.alert)C('⏰ '+alertText(p.alert),'alert','#ffd60a');p.labels.forEach(l=>C('#'+l,'label','#ff9f0a'));if(p.prio<4)C('⚑ '+PRIO[p.prio][1],'prio',PRIO[p.prio][0]);if(p.emoji)C(p.emoji+' tag','emoji','#8e8e93');return c.join('')}
function quickAdd(prefill){const S2=sheet(`<h2>Quick add</h2><div class="seg4" style="margin-top:10px" id="qm"><button type="button" data-m="event" class="${QMODE==='event'?'on':''}">Event</button><button type="button" data-m="task" class="${QMODE==='task'?'on':''}">Task</button></div>

<div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="btn sec press" id="qt" style="flex:1">Templates</button><button class="btn press" id="qgo" style="flex:2">Add</button></div>`);if(!S2)return;const{m,close}=S2;const ta=m.querySelector('#qa'),hl=m.querySelector('#qhl');

const upd=()=>{const L=lines();const multi=L.length>1;const p=parseQA(multi?L[0]:ta.value,QMODE,SEL&&TAB==='plan'?SEL:null);m.querySelectorAll('#qm button').forEach(b=>b.classList.toggle('on',b.dataset.m===(p.forced?'task':QMODE)));
hl.innerHTML=multi?esc(ta.value)+'\n':hlHTML(ta.value,p.spans);hl.scrollTop=ta.scrollTop;m.querySelector('#qc').innerHTML=multi?`<span class="chip on"><span>📋 ${L.length} tasks — one per line</span></span>`:chipsFor(p);

m.querySelector('#qp').innerHTML=multi?`<div class="qml">${L.map(l=>{const q=parseQA(l,'task');return `<div>• ${esc(q.title||l)}${q.date?' <span class="sub sm">'+esc(dayLabel(q.date).split(' · ')[0])+(q.time?' '+fmtMin(hm2min(q.time)):'')+'</span>':''}</div>`}).join('')}</div>`:(ta.value.trim()?`<div class="qp" style="--gc:${col}"><div class="nu" style="color:${liftText(col)}">${p.kind==='event'?'Event preview':'Task preview'}</div><div class="nm">${esc((p.emoji?p.emoji+' ':'')+(p.title||'Untitled'))}</div>
<div class="ln">📅 <span>${p.date?esc(dayLabel(p.date)):'No date · goes to Inbox'}${p.time?' · '+fmtMin(hm2min(p.time)):p.date?' · all day':''}</span></div>${p.repeat?`<div class="ln">↻ <span>${esc(rtext(p.repeat))}</span></div>`:''}${p.alert?`<div class="ln">⏰ <span>${esc(alertText(p.alert))}</span></div>`:''}${p.labels.length?`<div class="ln">🏷 <span>${esc(p.labels.map(l=>'#'+l).join(' '))}</span></div>`:''}<div class="ln"><span class="gd" style="--gc:${col}"></span><span>${p.prio<4?PRIO[p.prio][1]+' · ':''}color ${esc(col)}</span></div>
${p.kind==='event'?`<div class="ln" style="margin-top:8px"><a href="${esc(gcalUrl(p))}" target="_blank" rel="noopener" id="qgc">Add to Google Calendar (opens Google, nothing is written by the app) ›</a></div>`:''}</div>`:'')};
ta.addEventListener('input',upd);ta.addEventListener('scroll',()=>hl.scrollTop=ta.scrollTop);
m.querySelectorAll('#qm button').forEach(b=>b.onclick=()=>{QMODE=b.dataset.m;localStorage.setItem('brief-qmode',QMODE);upd()});
m.querySelector('#qt').onclick=()=>{close();setTimeout(tplSheet,380)};

/* ---------- slash commands in the Sophia note box ---------- */
const SLASH=[['/todo','Add a to-do (dates & #labels work)'],['/remind','Task with a reminder at its time'],['/sophia','Send the rest as a note to Sophia'],['/habit','Start a daily habit'],['/countdown','Count down to a date, e.g. Dakota’s show dec 13']];
function slashRun(body){const m=body.match(/^\/(\w+)\s*([\s\S]*)$/);if(!m)return null;const c=m[1].toLowerCase(),rest=m[2].trim();
if(c==='sophia')return {send:rest};if(!rest)return {err:'Type something after /'+c};
if(c==='todo'){const p=parseQA(rest,'task');addParsed(p);return {ok:`To-do added${p.date?' for '+dayLabel(p.date).split(' · ')[0]:' to Inbox'}`}}
if(c==='remind'){const p=parseQA(rest,'task');if(!p.date)p.date=DATE;if(!p.alert)p.alert=p.time?{before:0}:{date:p.date,time:min2hm(Math.min(1439,nowMin()+60))};addParsed(p);return {ok:'Reminder set: '+alertText(p.alert)}}
if(c==='habit'){S.habits.push({id:uid(),name:rest,emoji:'',remind:null,log:{}});save();return {ok:'Habit added'}}
if(c==='countdown'){const p=parseQA(rest,'task');if(!p.date||p.date===DATE&&!/today/i.test(rest)){const iso=rest.match(/\d{4}-\d{2}-\d{2}/);if(iso){p.date=iso[0];p.title=rest.replace(iso[0],'').trim()}else return {err:'Add a date, e.g. /countdown Dakota’s show dec 13'}}S.countdowns.push({id:uid(),name:p.title,date:p.date,emoji:p.emoji||''});save();return {ok:`Countdown: ${p.title} · ${dayDiff(DATE,p.date)} days`}}
return {err:'Unknown command /'+c}}
/* ---------- Apple Pencil sketch box ---------- */
let SK=null;
function sketchInit(){const w=$('#skw');if(!w)return;w.innerHTML=`<canvas class="skc" id="skc" aria-label="Sketch canvas"></canvas><div class="skt"><button type="button" class="fbtn on" data-tool="pen">✏️ Pen</button><button type="button" class="fbtn" data-tool="eraser">🧽 Eraser</button><button type="button" class="fbtn" id="sku">↶ Undo</button><button type="button" class="fbtn" id="skx">Clear</button><span class="sub sm" id="skp" style="align-self:center"></span></div>`;
const cv=$('#skc'),cx=cv.getContext('2d');const key='brief-sketch-'+DATE;let strokes=[];try{strokes=JSON.parse(localStorage.getItem(key)||'[]')}catch(x){}let tool='pen',cur=null,penSeen=false;
const fit=()=>{const r=cv.getBoundingClientRect(),dp=devicePixelRatio||1;cv.width=Math.max(1,r.width*dp);cv.height=r.height*dp;cx.setTransform(dp,0,0,dp,0,0);draw()};
const seg=(s,a,b)=>{cx.globalCompositeOperation=s.t==='eraser'?'destination-out':'source-over';cx.strokeStyle='#f2f2f7';cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=s.t==='eraser'?18:Math.max(1,(a[2]||.5)*4.5);cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()};
const draw=()=>{const r=cv.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);strokes.forEach(s=>{for(let i=1;i<s.p.length;i++)seg(s,s.p[i-1],s.p[i]);if(s.p.length===1)seg(s,s.p[0],[s.p[0][0]+.1,s.p[0][1],s.p[0][2]])});cx.globalCompositeOperation='source-over'};
const pt=e=>{const r=cv.getBoundingClientRect();return [Math.round((e.clientX-r.left)*10)/10,Math.round((e.clientY-r.top)*10)/10,e.pressure&&e.pointerType==='pen'?Math.round(e.pressure*100)/100:.5]};
const persist=()=>{try{localStorage.setItem(key,JSON.stringify(strokes))}catch(x){toast2('Sketch storage full')}window.__sketchStrokes=strokes.length};
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='pen')penSeen=true;if(penSeen&&e.pointerType==='touch')return;/* palm rejection */e.preventDefault();cv.setPointerCapture(e.pointerId);cur={t:tool,p:[pt(e)],id:e.pointerId};strokes.push(cur);$('#skp').textContent=e.pointerType==='pen'?'Pencil':''});
cv.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>{const p=pt(ev);seg(cur,cur.p[cur.p.length-1],p);cur.p.push(p)});cx.globalCompositeOperation='source-over'});
const end=e=>{if(!cur||e.pointerId!==cur.id)return;cur=null;persist()};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
w.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;w.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b))});
$('#sku').onclick=()=>{strokes.pop();persist();draw()};$('#skx').onclick=()=>{if(!strokes.length)return;const old=strokes;strokes=[];persist();draw();toast2('Sketch cleared',()=>{strokes=old;persist();draw()})};
fit();SK={fit};new ResizeObserver(()=>fit()).observe(cv)}

const APPURL='https://antmanfitness.github.io/the-brief/';
async function sha256hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let WTOK=[];
function widgetH(){const tk=localStorage.getItem('brief-widget-token');return `<div class="dtitle">Widget</div>${DS('A free Home Screen widget using the Scriptable app. Shows your next item, today’s counts and a countdown.')}
<div class="group"><ol class="steps"><li>Install <b>Scriptable</b> (free) from the App Store on the iPhone.</li><li>Tap <b>Create token</b> below, then <b>Copy widget script</b>.</li><li>In Scriptable tap <b>+</b>, paste, and name it <b>The Brief</b>.</li><li>Long-press the Home Screen → <b>+</b> → Scriptable → pick a size → Add.</li><li>Long-press the widget → Edit Widget → Script: <b>The Brief</b>; When Interacting: <b>Run Script</b>.</li><li>Tap the widget to open The Brief. Medium size adds <b>+ Task</b> and <b>Plan</b> buttons.</li></ol></div>
<div class="sh"><span>Token</span><span>${esc(SYNC)}</span></div>${DS('Read-only. Revoke any time and the widget stops loading.')}<div class="group">${tk?`<div class="kv"><span>Active on this device</span><span>…${esc(tk.slice(-6))}</span></div>`:''}<div id="wgl"><div class="kv"><span class="sub">Loading tokens…</span><span></span></div></div></div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn sec press" data-act="wg-new" style="flex:1">${tk?'New token':'Create token'}</button><button class="btn press" data-act="wg-copy" style="flex:1" ${tk?'':'disabled'}>Copy widget script</button></div><div class="err" id="wge"></div>
<p class="sub sm" style="margin:10px 4px">Not yet tested on a real iPhone Home Screen. Tasks reach the widget after the app syncs (a few seconds after a change).</p>`}
async function widgetList(){const el=$('#wgl');if(!el)return;try{WTOK=await api('/rest/v1/brief_widget_tokens?select=id,label,created_at,revoked&order=created_at.desc');el.innerHTML=WTOK.length?WTOK.map(t=>`<div class="kv"><span>${esc(t.label||'Widget')} · ${new Date(t.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span><span>${t.revoked?'Revoked':`<button class="mini" data-act="wg-rev" data-k="${t.id}" style="color:#ff6961">Revoke</button>`}</span></div>`).join(''):'<div class="kv"><span class="sub">No tokens yet</span><span></span></div>'}catch(x){el.innerHTML=`<div class="kv"><span class="sub">Could not load: ${esc(x.message)}</span><span></span></div>`}}
async function widgetNew(){try{const r=new Uint8Array(24);crypto.getRandomValues(r);const tk='bw_'+[...r].map(x=>x.toString(16).padStart(2,'0')).join('');await api('/rest/v1/brief_widget_tokens',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({token_sha256:await sha256hex(tk),label:'Scriptable widget'})});localStorage.setItem('brief-widget-token',tk);await pushS();toast2('Token created');rerender();openDetail('widget')}catch(x){const e=$('#wge');if(e)e.textContent='Could not create: '+x.message}}
async function widgetRevoke(id){try{await api('/rest/v1/brief_widget_tokens?id=eq.'+(+id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({revoked:true})});const tk=localStorage.getItem('brief-widget-token');if(tk){const h=await sha256hex(tk);const mine=await api('/rest/v1/brief_widget_tokens?select=id&revoked=eq.false&token_sha256=eq.'+h);if(!mine.length)localStorage.removeItem('brief-widget-token')}toast2('Token revoked');openDetail('widget')}catch(x){toast2('Could not revoke')}}

/* ---- auto-update ---- */
let REG=null,PENDING=0;
const busy=()=>!!document.querySelector('.modal')||!!(document.activeElement&&document.activeElement.matches('input,textarea,select'));
function doReload(b){if(sessionStorage.getItem('brief-reloaded-for')===String(b))return false;sessionStorage.setItem('brief-reloaded-for',String(b));
sessionStorage.setItem('brief-restore',JSON.stringify({tab:TAB,y:scrollY}));location.reload();return true}
function toast(b){if($('#updt'))return;const t=document.createElement('button');t.id='updt';t.className='updt';t.textContent='New version ready • Tap to update';t.onclick=()=>{sessionStorage.removeItem('brief-reloaded-for');doReload(b)};document.body.appendChild(t)}
function applyUpdate(b){PENDING=b;if(!busy()){if(!doReload(b))toast(b)}else toast(b)}
async function checkVer(){try{if(REG)REG.update().catch(()=>{});const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();if(+j.build>BUILD)applyUpdate(+j.build)}catch(x){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(PENDING){sessionStorage.removeItem('brief-reloaded-for');sessionStorage.setItem('brief-restore',JSON.stringify({tab:TAB,y:scrollY}));sessionStorage.setItem('brief-reloaded-for',String(PENDING));setTimeout(()=>location.reload(),50)}}else checkVer()});
addEventListener('focus',checkVer);setInterval(checkVer,5*60*1000);
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;
navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{REG=r;r.update().catch(()=>{})}).catch(()=>{});
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;if(sessionStorage.getItem('brief-cc')===String(BUILD))return;sessionStorage.setItem('brief-cc',String(BUILD));if(!busy()&&!PENDING)checkVer()})}
(()=>{try{const r=JSON.parse(sessionStorage.getItem('brief-restore')||'null');if(r){sessionStorage.removeItem('brief-restore');if(r.tab){TAB=r.tab;localStorage.setItem('brief-tab',TAB)}RESTORE_Y=r.y||0}}catch(x){}})();
setTimeout(checkVer,1500);
if(!recoveryFromHash()){const eh=new URLSearchParams(location.hash.slice(1));if(eh.get('error')){history.replaceState(null,'',location.pathname);sess=null;localStorage.removeItem('brief-sess');renderLogin('That reset link has expired or was already used. Request a new one.')}else load()}
