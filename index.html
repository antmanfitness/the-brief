<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030404"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="The Brief">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>The Brief</title>
<style>
:root{--accent:#2fbf71;--accent-2:#5fd895;--accent-dim:rgba(47,191,113,.2);--btn:#15803d;--bg:#030404;--bg2:#090b0d;--card:#17191e;--card2:#20242b;--line:rgba(47,191,113,.34);--text:#f4f1ea;--muted:#8d929b;--red:#ff4338;--amber:#e0b05a;--live:#4dff9a;--hair:rgba(255,255,255,.1)}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 30px)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-size:26px;margin:0;letter-spacing:-.5px}h1 b{color:var(--accent)}.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--accent-2);display:flex;justify-content:space-between}
.card h2 span{color:var(--muted);font-weight:500}
.row{padding:10px 0;border-top:1px solid var(--hair);overflow-wrap:anywhere}.row:first-of-type{border-top:0;padding-top:0}
.t{font-weight:600}.m{color:var(--muted);font-size:13px}a{color:var(--accent-2)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--accent-dim);color:var(--live);font-weight:600}
.pill.amber{background:rgba(224,176,90,.18);color:var(--amber)}.pill.red{background:rgba(255,67,56,.2);color:#ff786e}
.ses{display:flex;gap:12px;align-items:center}.ses .time{font-weight:700;color:var(--accent);width:78px;flex:none}
.banner{background:rgba(224,176,90,.15);border:1px solid var(--amber);color:var(--amber);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--live)}
button,.btn{appearance:none;border:0;border-radius:12px;background:var(--btn);color:#fff;font-weight:700;padding:12px 14px;font-size:15px;cursor:pointer}
button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--hair);padding:8px 12px;font-size:13px}
input,textarea,select{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--hair);border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.login{max-width:380px;margin:12vh auto 0}.err{color:#ff786e;font-size:13px;min-height:18px;margin-top:8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale button{padding:10px 0;background:var(--card2);border:1px solid var(--hair);color:var(--text)}
.scale button.on{background:var(--accent);color:#03140a;border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.pat{max-width:300px;margin:4px auto}.pat svg{width:100%;display:block;user-select:none;-webkit-user-select:none}.dot{fill:var(--card2);stroke:var(--muted);stroke-width:2}.dot.on{fill:var(--accent);stroke:var(--live)}.pl{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.empty{color:var(--muted);font-size:13px}.hide{display:none!important}
</style></head><body><div class="wrap" id="app"></div>
<script>
const SB='https://bvbcydanngfzemnnbuxa.supabase.co',KEY='sb_publishable_6ty7ZiomiqfHSr8HT07-sQ_2gMLSkZe';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(new Date())}
let sess=JSON.parse(localStorage.getItem('brief-sess')||'null');
async function auth(body,grant){const r=await fetch(SB+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Login failed');j.exp=Date.now()+j.expires_in*1000;sess=j;localStorage.setItem('brief-sess',JSON.stringify(j));return j}
async function tok(){if(sess&&Date.now()>sess.exp-60000){try{await auth({refresh_token:sess.refresh_token},'refresh_token')}catch(e){logout();throw e}}return sess.access_token}
async function api(path,opt={}){const t=await tok();const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){logout();throw new Error('Session expired')}const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Request failed');return j}
function logout(){sess=null;localStorage.removeItem('brief-sess');renderLogin()}
const mapUser=v=>{const u=v.trim().toLowerCase();return u==='krishna'?'antmanfitness@gmail.com':(u.includes('@')?u:null)};
const derive=seq=>'brief-pattern:'+seq.join('-');
function patternPad(host,onDone){host.innerHTML='<div class="pat"><svg viewBox="0 0 300 300"></svg></div>';const svg=host.querySelector('svg'),NS='http://www.w3.org/2000/svg',P=[];
for(let i=0;i<9;i++){P.push([50+(i%3)*100,50+Math.floor(i/3)*100]);const c=document.createElementNS(NS,'circle');c.setAttribute('cx',P[i][0]);c.setAttribute('cy',P[i][1]);c.setAttribute('r',14);c.setAttribute('class','dot');c.dataset.i=i;svg.appendChild(c)}
const pl=document.createElementNS(NS,'polyline');pl.setAttribute('class','pl');svg.insertBefore(pl,svg.firstChild);
let seq=[],down=false,cur=null;const pt=e=>{const r=svg.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*300/r.height]};
const draw=()=>{pl.setAttribute('points',seq.map(i=>P[i].join(',')).concat(cur&&down?[cur.join(',')]:[]).join(' '));svg.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',seq.includes(+d.dataset.i)))};
const hit=([x,y])=>{for(let i=0;i<9;i++)if(!seq.includes(i)&&Math.hypot(x-P[i][0],y-P[i][1])<34){const l=seq[seq.length-1];if(l!=null){const m=(l+i)/2;if(Number.isInteger(m)&&(l%3+i%3)%2===0&&(Math.floor(l/3)+Math.floor(i/3))%2===0&&!seq.includes(m))seq.push(m)}seq.push(i)}};
svg.style.touchAction='none';
svg.addEventListener('pointerdown',e=>{e.preventDefault();svg.setPointerCapture(e.pointerId);down=true;seq=[];cur=pt(e);hit(cur);draw()});
svg.addEventListener('pointermove',e=>{if(!down)return;cur=pt(e);hit(cur);draw()});
const up=()=>{if(!down)return;down=false;draw();const s=seq.map(i=>i+1);onDone(s,()=>{seq=[];draw()})};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up)}
function renderLogin(msg=''){app.innerHTML=`<div class="login"><h1>The <b>Brief</b></h1><p class="sub">Your morning, on one screen.</p>
<form id="lf" class="card"><label for="em">Username</label><input id="em" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<div id="pwrap"><label>Draw your pattern</label><div id="pad"></div></div>
<div id="tw" class="hide"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button style="width:100%;margin-top:14px">Sign in</button></div>
<div class="err" id="er">${esc(msg)}</div><a href="#" id="tg" class="m">Use password instead</a></form></div>`;
const fail=()=>{$('#er').textContent='Wrong username or password'};
const go=async(pw,viaPw)=>{$('#er').textContent='';const email=mapUser($('#em').value);if(!email)return fail();try{const j=await auth({email,password:pw},'password');if(viaPw&&!(j.user&&j.user.user_metadata&&j.user.user_metadata.pattern_set))return renderSetPattern(true);load()}catch(x){fail()}};
patternPad($('#pad'),(s,reset)=>{reset();if(s.length<4){$('#er').textContent='Connect at least 4 dots';return}go(derive(s),false)});
$('#tg').onclick=e=>{e.preventDefault();const t=$('#tw').classList.toggle('hide');$('#pwrap').classList.toggle('hide',!t);$('#tg').textContent=t?'Use password instead':'Use pattern instead';if(!t)$('#pw').focus()};
$('#lf').onsubmit=e=>{e.preventDefault();if(!$('#tw').classList.contains('hide'))go($('#pw').value,true)}}
function renderSetPattern(first){let one=null;app.innerHTML=`<div class="login"><h1>${first?'Set your pattern':'Change pattern'}</h1><p class="sub" id="ph">Connect at least 4 dots.</p><div class="card"><div id="pad"></div><div class="err" id="er"></div>
<button class="ghost" id="sk" style="width:100%;margin-top:8px">${first?'Skip for now':'Cancel'}</button></div></div>`;
$('#sk').onclick=()=>load();
patternPad($('#pad'),async(s,reset)=>{reset();$('#er').textContent='';if(s.length<4){$('#er').textContent='Connect at least 4 dots';return}
if(!one){one=s.join('-');$('#ph').textContent='Draw it again to confirm.';return}
if(one!==s.join('-')){one=null;$('#ph').textContent='Didn’t match. Start over — connect at least 4 dots.';return}
try{await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:derive(s),data:{pattern_set:true}})});$('#ph').textContent='Pattern saved.';setTimeout(load,700)}catch(x){one=null;$('#er').textContent='Could not save: '+x.message}})}
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
function statusPill(s){s=String(s||'');const l=s.toLowerCase();const c=/deliver/.test(l)?'':/(delay|exception|fail|return)/.test(l)?'red':'amber';return `<span class="pill ${c}">${esc(s||'—')}</span>`}
function block(title,count,inner){return `<section class="card"><h2>${title}<span>${count??''}</span></h2>${inner}</section>`}
function render(d,date){const em=arr(d.emails),se=arr(d.sessions),td=arr(d.todos),or=arr(d.orders),sl=d.sleep||{},ci=d.checkin;
const nice=new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
app.innerHTML=`<header><div><h1>The <b>Brief</b></h1><div class="sub">${esc(nice)}</div></div><div style="display:flex;gap:6px"><button class="ghost" id="cp">Change pattern</button><button class="ghost" id="lo">Sign out</button></div></header>
${d.is_example?'<div class="banner">EXAMPLE DATA — not real. Sophia will replace this.</div>':''}
${block('Important emails',em.length,em.length?em.map(e=>`<div class="row"><div class="t">${esc(e.sender)}</div><div>${safeUrl(e.link)?`<a href="${safeUrl(e.link)}" target="_blank" rel="noopener">${esc(e.subject)}</a>`:esc(e.subject)}</div><div class="m">${esc(e.why)}</div></div>`).join(''):'<div class="empty">Nothing urgent.</div>')}
${block('Clients today',se.length,se.length?se.map(s=>`<div class="row ses"><div class="time">${esc(s.time)}</div><div class="t">${esc(s.name)}</div></div>`).join(''):'<div class="empty">No sessions booked.</div>')}
${block('To-dos carried over',td.length,td.length?td.map(t=>`<div class="row"><div>${esc(typeof t==='string'?t:t.text)}</div>${t.from?`<div class="m">from ${esc(t.from)}</div>`:''}</div>`).join(''):'<div class="empty">All clear.</div>')}
${block('Orders',or.length,or.length?or.map(o=>`<div class="row"><div style="display:flex;justify-content:space-between;gap:8px"><div class="t">${esc(o.store)}</div>${statusPill(o.status)}</div><div>${esc(o.item)}</div><div class="m">${o.eta?'ETA '+esc(o.eta):''}${safeUrl(o.tracking)?` · <a href="${safeUrl(o.tracking)}" target="_blank" rel="noopener">Track</a>`:''}</div></div>`).join(''):'<div class="empty">No orders in flight.</div>')}
${block('Sleep / overnight',sl.source?esc(sl.source):'',Object.keys(sl).length?`<div class="grid"><div class="stat"><b>${esc(sl.hours??'—')}</b><span class="m">hours</span></div><div class="stat"><b>${esc(sl.score??'—')}</b><span class="m">score</span></div><div class="stat"><b>${ci?esc(ci.sleep_quality):'—'}</b><span class="m">felt</span></div></div>${sl.notes?`<div class="m" style="margin-top:10px">${esc(sl.notes)}</div>`:''}`:'<div class="empty">No sleep data yet.</div>')}
${block('Morning check-in','',ci?`<div class="grid"><div class="stat"><b>${esc(ci.sleep_quality)}</b><span class="m">sleep</span></div><div class="stat"><b>${esc(ci.energy)}</b><span class="m">energy</span></div><div class="stat"><b style="font-size:16px">${esc(ci.mood||'—')}</b><span class="m">mood</span></div></div><div class="m" style="margin-top:10px">Soreness: ${esc(ci.soreness||'—')}${ci.note?' · '+esc(ci.note):''}</div>`:'<button id="ciopen" style="width:100%">Do check-in</button>')}`;
$('#lo').onclick=logout;$('#cp').onclick=()=>renderSetPattern(false);const b=$('#ciopen');if(b)b.onclick=()=>checkin(date);
if(!ci&&localStorage.getItem('brief-ci-shown')!==date){localStorage.setItem('brief-ci-shown',date);checkin(date)}}
function checkin(date){const v={sleep_quality:0,energy:0};const m=document.createElement('div');m.className='modal';
const sc=k=>`<div class="scale" data-k="${k}">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}">${n}</button>`).join('')}</div>`;
m.innerHTML=`<form class="sheet" id="cf"><h1 style="font-size:22px">Morning check-in</h1><p class="sub">Takes 20 seconds.</p>
<label>Sleep quality (1–5)</label>${sc('sleep_quality')}<label>Energy (1–5)</label>${sc('energy')}
<label>Mood</label><select id="mood"><option value="">—</option><option>Great</option><option>Good</option><option>Okay</option><option>Low</option><option>Stressed</option></select>
<label>Soreness</label><input id="sore" placeholder="e.g. legs a bit tight">
<label>One note</label><textarea id="note" rows="2" placeholder="Anything on your mind"></textarea>
<div class="err" id="cer"></div><div style="display:flex;gap:8px"><button type="button" class="ghost" id="later" style="flex:1">Later</button><button style="flex:2">Save</button></div></form>`;
document.body.appendChild(m);
m.querySelectorAll('.scale').forEach(s=>s.onclick=e=>{const n=e.target.dataset.n;if(!n)return;v[s.dataset.k]=+n;s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.n===n))});
m.querySelector('#later').onclick=()=>m.remove();
m.querySelector('#cf').onsubmit=async e=>{e.preventDefault();if(!v.sleep_quality||!v.energy){m.querySelector('#cer').textContent='Pick sleep quality and energy.';return}
try{await api('/rest/v1/rpc/brief_save_checkin',{method:'POST',body:JSON.stringify({p_date:date,p_data:{...v,mood:$('#mood').value,soreness:$('#sore').value.trim(),note:$('#note').value.trim()}})});m.remove();load()}catch(x){m.querySelector('#cer').textContent=x.message}}}
async function load(){if(!sess)return renderLogin();const date=today();app.innerHTML='<p class="sub" style="margin-top:30vh;text-align:center">Loading…</p>';
try{const own=await api('/rest/v1/brief_owners?select=user_id');if(!own.length){logout();return renderLogin('This account is not allowed.')}
const rows=await api('/rest/v1/brief_days?date=eq.'+date+'&select=*');render(rows[0]||{},date)}catch(x){if(sess)app.innerHTML=`<div class="card err">${esc(x.message)} <button class="ghost" onclick="load()">Retry</button></div>`}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
load();
</script></body></html>
